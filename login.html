<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Barbeiro - Elmont Barbearia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="tela-login">
    <form class="card-login" id="form-login">
        <h1>Área do Barbeiro</h1>
        <p class="subtitulo-login">Entre para gerenciar sua agenda</p>

        <label for="usuario">Usuário ou e-mail</label>
        <input type="text" id="usuario" name="usuario" placeholder="seu@email.com">

        <label for="senha">Senha</label>
<input type="password" id="senha" name="senha" placeholder="••••••••">

<p class="erro-login" id="erro-login"></p>

<button type="submit" class="botao-cta botao-login">Entrar</button>
    </form>
</main>

    <script src="js/script.js"></script>
</body>
</html>
