<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviços - A Barbearia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="topo-servicos">
    <a href="index.html" class="voltar">← Voltar</a>
    <h1>Nossos Serviços</h1>
</header>

<main class="lista-servicos">

    <div class="card-servico">
        <img src="https://via.placeholder.com/100" alt="Corte de cabelo">
        <div class="info-servico">
            <h2>Corte de cabelo</h2>
            <p class="duracao">40 min</p>
        </div>
        <p class="preco">R$ 45</p>
    </div>

    <div class="card-servico">
        <img src="https://via.placeholder.com/100" alt="Barba">
        <div class="info-servico">
            <h2>Barba</h2>
            <p class="duracao">30 min</p>
        </div>
        <p class="preco">R$ 35</p>
    </div>

    <div class="card-servico">
        <img src="https://via.placeholder.com/100" alt="Corte e barba">
        <div class="info-servico">
            <h2>Corte + Barba</h2>
            <p class="duracao">65 min</p>
        </div>
        <p class="preco">R$ 70</p>
    </div>

    <div class="card-servico">
        <img src="https://via.placeholder.com/100" alt="Corte infantil">
        <div class="info-servico">
            <h2>Infantil</h2>
            <p class="duracao">30 min</p>
        </div>
        <p class="preco">R$ 30</p>
    </div>

</main>

    <script src="js/script.js"></script>
</body>
</html>
